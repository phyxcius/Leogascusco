<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Repartidor | LeoGas Cusco</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e1b4b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 18px; }

    .driver-card { background: #ffffff; width: 100%; max-width: 460px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border: 1px solid #e2e8f0; padding: 24px 20px; text-align: center; }
    h1 { font-size: 22px; font-weight: 900; color: #6b21a8; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 12px; }

    select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 15px; font-weight: 700; color: #1e1b4b; background: #f8fafc; margin-bottom: 14px; }

    .status-panel { padding: 10px; border-radius: 10px; background: #f1f5f9; margin-bottom: 16px; font-size: 12px; }
    .status-panel.online { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; font-weight: 800; }

    .order-box { background: #faf5ff; border: 2px solid #c084fc; border-radius: 14px; padding: 14px; margin-bottom: 16px; text-align: left; }
    .order-box.empty { background: #f8fafc; border: 1.5px dashed #cbd5e1; text-align: center; color: #64748b; }

    .cultura-bar { display: flex; border-radius: 8px; overflow: hidden; border: 2px solid #cbd5e1; background: #e2e8f0; gap: 3px; margin-top: 8px; }
    .cultura-step { flex: 1; padding: 12px 4px; border: none; cursor: pointer; color: #ffffff; font-weight: 900; font-size: 11px; text-align: center; opacity: 0.3; }
    .step-rojo { background-color: #e52329; }
    .step-gris-osc { background-color: #555557; }
    .step-gris-claro { background-color: #8b8e91; }
    .cultura-step.activo { opacity: 1 !important; }
    .cultura-step:disabled { cursor: not-allowed; }

    .btn-action { width: 100%; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; margin-bottom: 8px; }
    .btn-connect { background: #16a34a; color: #ffffff; }
    .btn-disconnect { background: #dc2626; color: #ffffff; display: none; }

    /* MODAL CENTRADO EN LA PANTALLA */
    .driver-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .driver-modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      border: 3px solid #16a34a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .driver-modal-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .btn-modal-ok {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="driver-card">
    <div style="font-size:44px;">🦁</div>
    <h1>LeoGas Cusco</h1>
    <p class="subtitle">Panel de Navegación y Secuencia de Entrega</p>

    <div style="text-align:left;">
      <label style="font-size:11px; font-weight:800; color:#64748b;">SELECCIONA TU IDENTIFICADOR:</label>
      <select id="selectChofer" onchange="cambioDeChofer()">
        <option value="">Cargando repartidores desde Firebase...</option>
      </select>
    </div>

    <div class="status-panel" id="panelEstado">
      <span id="textoEstado">Offline 💤 (Desconectado)</span>
    </div>

    <div id="cajaOrdenAsignada" class="order-box empty">
      Esperando comanda asignada desde caja...
    </div>

    <div style="background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:16px;">
      <div style="font-size:11px; font-weight:800; color:#475569; display:flex; justify-content:space-between;">
        <span>Secuencia de Entrega</span>
        <span id="estadoActualTag" style="color:#6b21a8;">En espera</span>
      </div>

      <div class="cultura-bar">
        <button type="button" id="btnPaso1" class="cultura-step step-rojo" onclick="avanzarSecuencia(1)" disabled>
          <span>🟥 PASO 1</span><br>En Camino
        </button>
        <button type="button" id="btnPaso2" class="cultura-step step-gris-osc" onclick="avanzarSecuencia(2)" disabled>
          <span>⬛ PASO 2</span><br>Entregado
        </button>
        <button type="button" id="btnPaso3" class="cultura-step step-gris-claro" onclick="avanzarSecuencia(3)" disabled>
          <span>⬜ PASO 3</span><br>Completado
        </button>
      </div>
    </div>

    <button id="btnConectar" class="btn-action btn-connect" onclick="iniciarGPS()">
      ▶️ CONECTAR GPS EN RUTA
    </button>
    <button id="btnDesconectar" class="btn-action btn-disconnect" onclick="detenerGPS()">
      ⏹️ TERMINAR TURNO (Desconectar)
    </button>
  </div>

  <!-- MODAL CENTRADO: EL CLIENTE CONFIRMÓ QUE YA SALE -->
  <div class="driver-modal-overlay" id="modalClienteSale">
    <div class="driver-modal-box">
      <div class="driver-modal-icon">🚪🏃‍♂️</div>
      <h3 style="color:#15803d; font-size:20px; font-weight:900;">¡EL CLIENTE YA SALE!</h3>
      <p id="textoClienteSale" style="font-size:14px; color:#334155; margin-top:8px; line-height:1.4;">
        El cliente confirmó que está saliendo a la puerta. Ten listo el balón y el vuelto.
      </p>
      <button type="button" class="btn-modal-ok" onclick="cerrarModalClienteSale()">¡Entendido! 👍</button>
    </div>
  </div>

  <!-- SDK DE FIREBASE (TIEMPO REAL) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnYaUN-aZYzEip9z3wsuKnbwdfYscFZkY",
      authDomain: "leogas-cusco.firebaseapp.com",
      databaseURL: "https://leogas-cusco-default-rtdb.firebaseio.com",
      projectId: "leogas-cusco",
      storageBucket: "leogas-cusco.firebasestorage.app",
      messagingSenderId: "1042930313066",
      appId: "1:1042930313066:web:ce6c424afe606f63322713",
      measurementId: "G-MBYC61L9BL"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let ordenActiva = null;
    let watchIdGPS = null;
    let idUltimaOrdenVista = null;
    let avisoSalidaMostrado = false;
    let repartidoresMap = {};

    function emitirTimbreChofer() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.9);
      } catch(e) {}
    }

    function lanzarAlertaChofer(titulo, mensaje) {
      emitirTimbreChofer();
      if ("vibrate" in navigator) navigator.vibrate([400, 150, 400]);
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          const notif = new Notification(titulo, { body: mensaje, icon: "CHUSPITA-circulo.png" });
          notif.onclick = () => { window.focus(); notif.close(); };
        } catch(e) {}
      }
    }

    function escucharRepartidoresFirebase() {
      db.ref('repartidores').on('value', snap => {
        const data = snap.val();
        if (!data) return;

        repartidoresMap = data;
        const select = document.getElementById('selectChofer');
        const valorGuardado = localStorage.getItem("leogas_chofer_id") || select.value;

        select.innerHTML = '';
        Object.values(data).forEach(rep => {
          const opt = document.createElement('option');
          opt.value = rep.id;
          opt.innerText = `${rep.nombre} ${rep.online ? '🟢' : '💤'}`;
          select.appendChild(opt);
        });

        if (valorGuardado && data[valorGuardado]) {
          select.value = valorGuardado;
        } else if (select.options.length > 0) {
          select.selectedIndex = 0;
          localStorage.setItem("leogas_chofer_id", select.value);
        }

        escucharComandasEnTiempoReal();
      });
    }

    function cambioDeChofer() {
      idUltimaOrdenVista = null;
      avisoSalidaMostrado = false;
      localStorage.setItem("leogas_chofer_id", document.getElementById('selectChofer').value);
      escucharComandasEnTiempoReal();
    }

    function escucharComandasEnTiempoReal() {
      const repId = document.getElementById('selectChofer').value;
      if (!repId) return;

      db.ref('pedidos').on('value', snap => {
        const pedidos = snap.val();
        ordenActiva = null;

        if (pedidos) {
          ordenActiva = Object.values(pedidos).find(p => p.repartidorId === repId && p.estado !== 'completado');
        }

        // Nueva comanda asignada
        if (ordenActiva && ordenActiva.id !== idUltimaOrdenVista) {
          if (idUltimaOrdenVista !== null) {
            lanzarAlertaChofer(
              "🛵 ¡Nueva orden asignada!",
              `Llevar ${ordenActiva.tipoBalon} a ${ordenActiva.cliente} (Cobrar: S/ ${ordenActiva.montoCobro})`
            );
          }
          idUltimaOrdenVista = ordenActiva.id;
          avisoSalidaMostrado = false;
        } else if (!ordenActiva) {
          idUltimaOrdenVista = null;
          avisoSalidaMostrado = false;
        }

        // DETECCIÓN: EL CLIENTE PULSÓ "YA SALGO" EN INDEX.HTML
        if (ordenActiva && ordenActiva.clienteConfirmado === true && !avisoSalidaMostrado) {
          avisoSalidaMostrado = true;
          lanzarAlertaChofer("🚪 ¡El cliente ya sale!", `${ordenActiva.cliente} confirmó que está saliendo a la puerta.`);
          mostrarModalClienteSale(ordenActiva.cliente);
        }

        renderizarVistaOrden();
      });
    }

    function mostrarModalClienteSale(nombreCliente) {
      document.getElementById('textoClienteSale').innerHTML = `
        <strong>${nombreCliente || 'El cliente'}</strong> acaba de confirmar: <br>
        <span style="display:inline-block; margin-top:6px; font-size:16px; font-weight:800; color:#15803d;">"¡Ya salgo a recibir el gas!"</span>
      `;
      document.getElementById('modalClienteSale').style.display = 'flex';
    }

    function cerrarModalClienteSale() {
      document.getElementById('modalClienteSale').style.display = 'none';
    }

    function renderizarVistaOrden() {
      const caja = document.getElementById('cajaOrdenAsignada');
      const b1 = document.getElementById('btnPaso1');
      const b2 = document.getElementById('btnPaso2');
      const b3 = document.getElementById('btnPaso3');

      if (!ordenActiva) {
        caja.className = "order-box empty";
        caja.innerHTML = "💤 No tienes comandas pendientes. Espera a que caja te asigne un balón.";
        b1.disabled = true; b2.disabled = true; b3.disabled = true;
        b1.classList.remove('activo'); b2.classList.remove('activo'); b3.classList.remove('activo');
        document.getElementById('estadoActualTag').innerText = "Sin orden";
        return;
      }

      caja.className = "order-box";
      caja.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <strong style="color:#7e22ce;">${ordenActiva.tipoBalon}</strong>
          <span style="color:#15803d; font-weight:bold;">Cobrar: S/ ${parseFloat(ordenActiva.montoCobro).toFixed(2)}</span>
        </div>
        <div style="font-size:13px;">👤 <strong>Cliente:</strong> ${ordenActiva.cliente}</div>
        <div style="font-size:13px;">💵 <strong>Pago:</strong> ${ordenActiva.metodoPago}</div>
        ${ordenActiva.clienteConfirmado ? '<div style="margin-top:6px; font-size:12px; font-weight:800; color:#15803d;">✔️ Cliente avisó que ya está saliendo</div>' : ''}
        ${ordenActiva.gpsUrl ? `<a href="${ordenActiva.gpsUrl}" target="_blank" style="display:inline-block; background:#2563eb; color:#fff; text-decoration:none; padding:6px 12px; border-radius:6px; font-weight:bold; font-size:12px; margin-top:8px;">🗺️ Abrir Google Maps</a>` : ''}
      `;

      const etapa = ordenActiva.etapa || 0;
      b1.classList.toggle('activo', etapa === 1);
      b2.classList.toggle('activo', etapa === 2);
      b3.classList.toggle('activo', etapa === 3);

      if (etapa === 0) {
        b1.disabled = false; b2.disabled = true; b3.disabled = true;
        document.getElementById('estadoActualTag').innerText = "Orden Asignada (Pulsa Paso 1 al salir)";
      } else if (etapa === 1) {
        b1.disabled = true; b2.disabled = false; b3.disabled = true;
        document.getElementById('estadoActualTag').innerText = "Paso 1: En Camino 🔥";
      } else if (etapa === 2) {
        b1.disabled = true; b2.disabled = true; b3.disabled = false;
        document.getElementById('estadoActualTag').innerText = "Paso 2: En Puerta 🚪";
      } else if (etapa === 3) {
        b1.disabled = true; b2.disabled = true; b3.disabled = true;
        document.getElementById('estadoActualTag').innerText = "Paso 3: Completado ✔️";
      }
    }

    async function avanzarSecuencia(paso) {
      if (!ordenActiva) return;
      const etapaActual = ordenActiva.etapa || 0;

      if (etapaActual === 0 && paso !== 1) {
        return alert("⛔ Primero debes presionar 'Paso 1: En Camino' cuando salgas de la base.");
      }
      if (etapaActual === 1 && paso === 3) {
        return alert("⛔ Debes marcar primero 'Paso 2: Entregado' antes de completar.");
      }

      const updates = { etapa: paso };
      if (paso === 3) updates.estado = "completado";

      await db.ref(`pedidos/${ordenActiva.id}`).update(updates);
      if (paso === 3) alert("✔ ¡Entrega finalizada con éxito!");
    }

    function iniciarGPS() {
      const repId = document.getElementById('selectChofer').value;
      if (!repId) return alert("Selecciona un repartidor primero.");
      if (!navigator.geolocation) return alert("GPS no disponible.");

      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }

      navigator.geolocation.getCurrentPosition(pos => {
        actualizarCoordenadas(repId, true, pos.coords.latitude, pos.coords.longitude);
        document.getElementById('btnConectar').style.display = "none";
        document.getElementById('btnDesconectar').style.display = "block";
        document.getElementById('panelEstado').className = "status-panel online";
        document.getElementById('textoEstado').innerText = "Online 🔥 (En Ruta Activo)";

        watchIdGPS = navigator.geolocation.watchPosition(p => {
          actualizarCoordenadas(repId, true, p.coords.latitude, p.coords.longitude);
        }, null, { enableHighAccuracy: true });
      });
    }

    function detenerGPS() {
      if (watchIdGPS) navigator.geolocation.clearWatch(watchIdGPS);
      const repId = document.getElementById('selectChofer').value;
      if (repId) actualizarCoordenadas(repId, false, null, null);
      document.getElementById('btnConectar').style.display = "block";
      document.getElementById('btnDesconectar').style.display = "none";
      document.getElementById('panelEstado').className = "status-panel";
      document.getElementById('textoEstado').innerText = "Offline 💤 (Desconectado)";
    }

    function actualizarCoordenadas(repId, online, lat, lng) {
      const data = { online: online };
      if (lat && lng) { data.lat = lat; data.lng = lng; }
      db.ref(`repartidores/${repId}`).update(data);
    }

    window.onload = () => {
      escucharRepartidoresFirebase();
    };
  </script>
</body>
</html>
