<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Repartidor | LeoGas Cusco</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; color: #1e1b4b; }

    /* CONTENEDOR PRINCIPAL: MAPA ARRIBA (100% DE PANTALLA) */
    #mapaRepartidor {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BARRA SUPERIOR FLOTANTE (ESTILO INDRIVE) */
    .top-status-floating {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* TARJETA INFERIOR FLOTANTE CON SECUENCIA Y DATOS */
    .bottom-delivery-card {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
      z-index: 10;
      max-height: 45vh;
      overflow-y: auto;
    }

    .secuencia-steps-bar {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      height: 26px;
      margin: 12px 0;
      background: #e2e8f0;
      gap: 2px;
    }
    .step-block {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      opacity: 0.3;
    }
    .step-block.activo { opacity: 1; background: #16a34a !important; }

    .btn-accion-repartidor {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 1. MAPA EN LA MISMA VENTANA (OCUPA EL FONDO SUPERIOR) -->
  <div id="mapaRepartidor"></div>

  <!-- 2. ESTADO SUPERIOR FLOTANTE -->
  <div class="top-status-floating">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:22px;">🦁</span>
      <div>
        <strong style="font-size:13px; color:#6b21a8;" id="lblNombreChofer">Chofer Conectado</strong>
        <div style="font-size:10px; color:#15803d; font-weight:800;">● GPS ACTIVO EN VIVO</div>
      </div>
    </div>
    <button type="button" class="btn" style="background:#fee2e2; color:#dc2626; padding:6px 12px; font-size:11px; font-weight:bold; border-radius:8px; border:none;" onclick="cambiarEstadoOnline(false)">Desconectarse</button>
  </div>

  <!-- 3. TARJETA INFERIOR FLOTANTE CON SECUENCIA Y DETALLES -->
  <div class="bottom-delivery-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="badgeTipoVenta" style="background:#fef08a; color:#854d0e; font-size:10.5px; font-weight:900; padding:3px 8px; border-radius:8px;">PEDIDO EN CURSO</span>
      <strong id="lblMontoOrden" style="font-size:18px; color:#15803d; font-weight:900;">S/ 0.00</strong>
    </div>

    <h3 id="lblClienteOrden" style="margin:6px 0 2px; font-size:17px; color:#1e1b4b;">Esperando asignación de pedido...</h3>
    <p id="lblDireccionOrden" style="font-size:12.5px; color:#64748b; margin-bottom:8px;">📍 --</p>

    <!-- Barra de Secuencia de Entrega -->
    <div class="secuencia-steps-bar">
      <div class="step-block" id="step1" style="background:#e52329;">1. EN CAMINO</div>
      <div class="step-block" id="step2" style="background:#555557;">2. EN PUERTA</div>
      <div class="step-block" id="step3" style="background:#8b8e91;">3. COMPLETADO</div>
    </div>

    <button type="button" class="btn-accion-repartidor" id="btnAvanzarEtapa" onclick="avanzarEtapaPedido()">
      🛵 Iniciar Ruta al Local / Casa
    </button>
  </div>

  <!-- Leaflet JS y Firebase -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnYaUN-aZYzEip9z3wsuKnbwdfYscFZkY",
      authDomain: "leogas-cusco.firebaseapp.com",
      databaseURL: "https://leogas-cusco-default-rtdb.firebaseio.com",
      projectId: "leogas-cusco"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let mapRepartidor = null;
    let markerChofer = null;
    let markerDestino = null;
    let pedidoActivo = null;
    let miRepartidorId = localStorage.getItem('leogas_rep_id') || "rep-1"; // ID del chofer logueado

    function inicializarMapaRepartidor() {
      if (mapRepartidor) return;
      // Centrado inicial en Cusco
      mapRepartidor = L.map('mapaRepartidor', { zoomControl: false }).setView([-13.5167, -71.9788], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(mapRepartidor);

      // Iniciar seguimiento GPS del propio celular del repartidor en tiempo real
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          // Actualizar posición en Firebase para que el Admin la vea en vivo
          db.ref(`repartidores/${miRepartidorId}`).update({ lat, lng, online: true });

          // Dibujar marcador del chofer en su propio mapa
          if (!markerChofer) {
            const iconoChofer = L.divIcon({
              html: "<div style='background:#7e22ce; color:white; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:20px; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);'>🛵</div>",
              iconSize: [40, 40], iconAnchor: [20, 20]
            });
            markerChofer = L.marker([lat, lng], { icon: iconoChofer }).addTo(mapRepartidor);
          } else {
            markerChofer.setLatLng([lat, lng]);
          }
        }, err => console.log(err), { enableHighAccuracy: true });
      }
    }

    // Escuchar el pedido asignado a este repartidor en tiempo real desde Firebase
    function escucharPedidosRepartidor() {
      db.ref('pedidos').on('value', snap => {
        const pedidos = snap.val();
        if (!pedidos) return;

        // Buscar pedido activo asignado a este chofer
        const ordenes = Object.values(pedidos);
        pedidoActivo = ordenes.find(p => p.repartidorId === miRepartidorId && p.estado !== 'completado');

        if (pedidoActivo) {
          actualizarInterfazConPedido(pedidoActivo);
        } else {
          document.getElementById('lblClienteOrden').innerText = "Sin pedidos asignados por ahora 💤";
          document.getElementById('lblDireccionOrden').innerText = "Esperando que el administrador te asigne una orden...";
          document.getElementById('lblMontoOrden').innerText = "S/ 0.00";
        }
      });
    }

    function actualizarInterfazConPedido(orden) {
      document.getElementById('lblClienteOrden').innerText = orden.cliente || 'Cliente';
      document.getElementById('lblDireccionOrden').innerText = `📍 ${orden.direccionTexto || 'Cusco'}`;
      document.getElementById('lblMontoOrden').innerText = `S/ ${parseFloat(orden.montoCobro || 0).toFixed(2)}`;
      
      const etapa = orden.etapa || 0;
      document.getElementById('step1').classList.toggle('activo', etapa >= 1);
      document.getElementById('step2').classList.toggle('activo', etapa >= 2);
      document.getElementById('step3').classList.toggle('activo', etapa >= 3);

      const btn = document.getElementById('btnAvanzarEtapa');
      if (etapa === 0) {
        btn.innerText = "🛵 Marcar: En Camino al Local/Casa";
      } else if (etapa === 1) {
        btn.innerText = "🚪 Marcar: En Puerta / Local";
      } else if (etapa === 2) {
        btn.innerText = "✔ Marcar: Entrega Completada";
      }

      // Si el pedido tiene coordenadas o ubicación, marcar el destino en el mapa superior
      if (orden.lat && orden.lng) {
        if (!markerDestino) {
          const iconoDestino = L.divIcon({
            html: "<div style='background:#2563eb; color:white; border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:18px; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);'>🏠</div>",
            iconSize: [38, 38], iconAnchor: [19, 19]
          });
          markerDestino = L.marker([orden.lat, orden.lng], { icon: iconoDestino }).addTo(mapRepartidor);
        } else {
          markerDestino.setLatLng([orden.lat, orden.lng]);
        }
        mapRepartidor.setView([orden.lat, orden.lng], 15);
      }
    }

    async function avanzarEtapaPedido() {
      if (!pedidoActivo) return alert("No hay ningún pedido activo.");
      let nuevaEtapa = (pedidoActivo.etapa || 0) + 1;

      if (nuevaEtapa > 3) nuevaEtapa = 3;

      const updates = { etapa: nuevaEtapa };
      if (nuevaEtapa === 3) {
        updates.estado = "completado";
      }

      await db.ref(`pedidos/${pedidoActivo.id}`).update(updates);
      if (nuevaEtapa === 3) {
        alert("🎉 ¡Entrega finalizada con éxito!");
      }
    }

    window.onload = () => {
      inicializarMapaRepartidor();
      escucharPedidosRepartidor();
    };
  </script>
</body>
</html>
