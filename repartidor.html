  <!-- TARJETA INFERIOR TIPO ITINERARIO (ESTILO INDRIVER + RUTA) -->
  <div class="bottom-delivery-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="badgeTipoVenta" style="background:#fef08a; color:#854d0e; font-size:10.5px; font-weight:900; padding:3px 8px; border-radius:8px;">RUTA DE REPARTO ACTIVA</span>
      <span class="indriver-price-tag" id="lblMontoOrden">S/ 0.00</span>
    </div>

    <h3 id="lblClienteOrden" style="margin:6px 0 2px; font-size:17px; color:#1e1b4b;">Buscando ruta asignada...</h3>
    
    <!-- CONTENEDOR DE LA RUTA / ITINERARIO DE PEDIDOS -->
    <div id="contenedorItinerarioRuta" style="margin: 10px 0; max-height: 140px; overflow-y: auto;">
      <div class="route-point-row">
        <div class="route-badge-letter">A</div>
        <div>
          <div style="font-size:10px; font-weight:800; color:#64748b; text-transform:uppercase;">Punto de Partida / Base</div>
          <strong style="font-size:12.5px; color:#1e1b4b;">Central LeoGas Cusco (Calle Garcilaso)</strong>
        </div>
      </div>
      <div class="route-point-row">
        <div class="route-badge-letter destino">B</div>
        <div>
          <div style="font-size:10px; font-weight:800; color:#64748b; text-transform:uppercase;">Punto de Entrega Actual</div>
          <strong id="lblDireccionOrden" style="font-size:12.5px; color:#16a34a;">--</strong>
        </div>
      </div>
    </div>

    <!-- Botón de Navegación GPS Directa -->
    <a id="btnNavegarRuta" href="#" target="_blank" class="btn-nav-maps" style="display:none;">
      🧭 Abrir Navegación GPS (Google Maps / Waze)
    </a>

    <!-- Barra de Secuencia de Entrega -->
    <div class="secuencia-steps-bar">
      <div class="step-block" id="step1" style="background:#e52329;">1. EN CAMINO</div>
      <div class="step-block" id="step2" style="background:#555557;">2. EN PUERTA</div>
      <div class="step-block" id="step3" style="background:#8b8e91;">3. COMPLETADO</div>
    </div>

    <button type="button" class="btn-accion-repartidor" id="btnAvanzarEtapa" onclick="avanzarEtapaPedido()">
      Esperando asignación...
    </button>
  </div>
