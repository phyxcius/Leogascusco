<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | LeoGas</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e1b4b; padding: 20px; max-width: 700px; margin: auto; }
    h2 { color: #6b21a8; margin-bottom: 8px; }
    .card { background: #fff; padding: 16px; border-radius: 10px; border: 1px solid #cbd5e1; margin-bottom: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-top: 8px; }
    input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-save { background: #6b21a8; color: white; width: 100%; font-size: 15px; }
    .btn-add { background: #16a34a; color: white; margin-bottom: 16px; width: 100%; }
    .btn-del { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; margin-top: 8px; }
    .token-box { background: #fef08a; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #eab308; }
  </style>
</head>
<body>

  <h2>🦁 Panel de Gestión LeoGas</h2>
  <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">Los cambios guardados aquí se sincronizarán directamente con GitHub.</p>

  <div class="token-box">
    <label for="ghToken">Token Personal de GitHub (ghp_...):</label>
    <input type="password" id="ghToken" placeholder="Pega tu token aquí">
    <button class="btn" style="background:#1e1b4b; color:#fff; padding:6px 12px; font-size:12px;" onclick="guardarToken()">Guardar Token en este equipo</button>
  </div>

  <button class="btn btn-add" onclick="agregarNuevoProducto()">➕ Agregar Balón al Catálogo</button>
  <div id="listaProductos"></div>
  <button class="btn btn-save" onclick="sincronizarConGitHub()">🚀 Guardar y Publicar en GitHub</button>

  <script>
    const USUARIO = "phyxcius";
    const REPOSITORIO = "Leogascusco";
    const ARCHIVO = "productos.json";

    let productos = [];
    let fileSha = "";

    function guardarToken() {
      const t = document.getElementById('ghToken').value.trim();
      if (!t) return alert("Ingresa un token válido.");
      localStorage.setItem('gh_admin_token', t);
      alert("Token guardado localmente.");
      cargarDesdeGitHub();
    }

    async function cargarDesdeGitHub() {
      const token = localStorage.getItem('gh_admin_token');
      if (token) document.getElementById('ghToken').value = token;

      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPOSITORIO}/contents/${ARCHIVO}?ref=main`, {
          headers: token ? { "Authorization": `token ${token}` } : {}
        });

        if (!res.ok) throw new Error("No se pudo cargar productos.json de GitHub");
        const data = await res.json();
        fileSha = data.sha;
        const contenidoDecodificado = decodeURIComponent(escape(atob(data.content)));
        productos = JSON.parse(contenidoDecodificado);
        renderizar();
      } catch (e) {
        console.error(e);
      }
    }

    function renderizar() {
      const cont = document.getElementById('listaProductos');
      cont.innerHTML = '';
      productos.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <label>Nombre:</label>
          <input type="text" value="${p.nombre}" onchange="productos[${i}].nombre = this.value">
          <div style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label>Precio (S/):</label>
              <input type="number" step="0.5" value="${p.precio}" onchange="productos[${i}].precio = parseFloat(this.value)">
            </div>
            <div style="flex:1;">
              <label>Disponibilidad:</label>
              <select onchange="productos[${i}].disponible = (this.value === 'true')">
                <option value="true" ${p.disponible !== false ? 'selected' : ''}>Disponible</option>
                <option value="false" ${p.disponible === false ? 'selected' : ''}>Agotado</option>
              </select>
            </div>
          </div>
          <label>Nombre de archivo de imagen:</label>
          <input type="text" value="${p.imagen}" onchange="productos[${i}].imagen = this.value">
          <button class="btn btn-del" onclick="eliminar(${i})">🗑️ Eliminar Producto</button>
        `;
        cont.appendChild(div);
      });
    }

    function agregarNuevoProducto() {
      productos.push({
        id: "gas-" + Date.now(),
        nombre: "Nuevo Balón de Gas",
        tag: "Sellado",
        descripcion: "Balón sellado con peso garantizado.",
        precio: 50.00,
        disponible: true,
        imagen: "1000360632_2.jpg"
      });
      renderizar();
    }

    function eliminar(i) {
      if (confirm("¿Eliminar este producto?")) {
        productos.splice(i, 1);
        renderizar();
      }
    }

    async function sincronizarConGitHub() {
      const token = localStorage.getItem('gh_admin_token') || document.getElementById('ghToken').value.trim();
      if (!token) return alert("Se requiere el token de GitHub para guardar.");

      const nuevoContenido = btoa(unescape(encodeURIComponent(JSON.stringify(productos, null, 2))));

      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPOSITORIO}/contents/${ARCHIVO}`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Actualización de catálogo desde admin.html",
            content: nuevoContenido,
            sha: fileSha,
            branch: "main"
          })
        });

        if (!res.ok) throw new Error("Error al guardar en GitHub. Verifica permisos del token.");
        const respData = await res.json();
        fileSha = respData.content.sha;
        alert("✔ ¡Catálogo guardado en GitHub exitosamente! En 30-60 segundos se verá reflejado en la web de todos los clientes.");
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    window.onload = cargarDesdeGitHub;
  </script>
</body>
</html>
